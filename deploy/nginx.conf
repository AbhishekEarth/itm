## ITM Gwalior — production nginx config
## Deploy at /etc/nginx/sites-available/itmgoi.conf and symlink to sites-enabled
## Requires certbot for SSL: `certbot --nginx -d itmgoi.in -d www.itmgoi.in`
## Requires nginx with ngx_brotli compiled in (apt-get install -y libnginx-mod-brotli)

# Upstream API (gunicorn/uvicorn)
upstream itm_api {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# Redirect bare http → https
server {
    listen 80;
    listen [::]:80;
    server_name itmgoi.in www.itmgoi.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name itmgoi.in www.itmgoi.in;

    # SSL — managed by certbot
    ssl_certificate     /etc/letsencrypt/live/itmgoi.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itmgoi.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Hardened security headers (mirrors what FastAPI sets, but more aggressive in nginx)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Adjust CSP origins when you switch to a CDN / external analytics
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com; font-src 'self' data:; connect-src 'self' https://itmgoi.in; frame-src https://www.google.com" always;

    # ── Compression ──────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/xml+rss application/atom+xml image/svg+xml;

    # Brotli (better than gzip — needs libnginx-mod-brotli)
    brotli on;
    brotli_comp_level 5;
    brotli_types
        text/plain text/css application/javascript application/json
        application/xml image/svg+xml application/xml+rss;

    # ── Body size for media uploads ──────────────────────────────
    client_max_body_size 50M;

    # ── Static SPA bundle ────────────────────────────────────────
    root /var/www/itmgoi/dist;
    index index.html;

    # Long-cache hashed assets (Vite includes hash in filename)
    location ~* ^/assets/.+\.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # User-uploaded media served directly from disk (NOT through FastAPI)
    location /uploads/ {
        alias /var/itm/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Pretty SEO endpoints
    location = /sitemap.xml { proxy_pass http://itm_api/api/public/sitemap.xml; }
    location = /robots.txt  { proxy_pass http://itm_api/api/public/robots.txt; }

    # API
    location /api/ {
        proxy_pass http://itm_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # Tiny public-payload micro-cache so a stampede doesn't hit the app
        proxy_cache_bypass $http_x_no_cache;
    }

    # SPA fallback — all other paths get index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
