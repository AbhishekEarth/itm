## Production docker-compose for ITM Gwalior.
## Place at /opt/itmgoi/docker-compose.yml on the VPS.
## Runs the API + Postgres + Redis behind the host's nginx (configured separately).

name: itmgoi-prod

services:
  api:
    image: ghcr.io/itmgoi/itmgoi-api:${IMAGE_TAG:-latest}
    container_name: itm-api
    restart: unless-stopped
    env_file: /opt/itmgoi/.env
    environment:
      ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /var/itm/uploads
    volumes:
      - /var/itm/uploads:/var/itm/uploads
    ports:
      - "127.0.0.1:8000:8000"      # only loopback; nginx terminates TLS in front
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1.5g

  db:
    image: postgres:16-alpine
    container_name: itm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /var/itm/pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: itm-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "127.0.0.1:6379:6379"

  backup:
    image: ghcr.io/itmgoi/itmgoi-api:${IMAGE_TAG:-latest}
    container_name: itm-backup
    restart: unless-stopped
    env_file: /opt/itmgoi/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - /var/itm/backups:/var/itm/backups
      - ./backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache postgresql16-client gnupg awscli >/dev/null 2>&1 || true
        echo "0 3 * * * /usr/local/bin/backup.sh" > /etc/crontabs/root
        crond -f -L /dev/stdout
    depends_on:
      db:
        condition: service_healthy
